# Platform mapping for ROMM Sync
# The entry is the folder "slug" expected by romm and the list below is all the library folder names that will match to it.
#
# Add your own to the list under each platform if needed. By default, this list attempts to cover for common slugs used in MinUI/NextUI and Knulli.
# The match is not case-sensitive.

