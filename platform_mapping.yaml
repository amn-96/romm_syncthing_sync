# Platform mapping for ROMM Sync
# The entry is the folder "slug" expected by romm and the list below is all the library folder names that will match to it.
# If there is a library slug not in this list, it will attempt to match to the romm slug directly. So,
#   **if your platform folder name already matches romm, you don't need to touch this**, even if it's not in this yaml!

# Add your own to the list if needed, follwing the format:
# <romm slug>:
#   - <library folder name>
# By default, this list attempts to cover for some common systems and alternative slugs used in MinUI/NextUI and Knulli.
# It is NOT exhaustive. Please see https://docs.romm.app/4.5.0/Platforms-and-Players/Supported-Platforms/.

# Local library matches are not case-sensitive. Romm slugs are lowercase only (and its match is case-sensitive, so take care to match case for the romm slug)

