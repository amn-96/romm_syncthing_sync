
---
services:
  romm-sync:
    image: ghcr.io/amn-96/romm_syncthing_sync:latest
    container_name: romm-sync
    restart: unless-stopped
    env_file: .env.example
    volumes:
    # do NOT change these. Update the variables in .env. 
    # The /syncdata/... bind mounts are hardcoded in the container.
      # - ${ALL_SYNC_FOLDER}:/syncdata:ro  # Uncomment if saves and states in the same folder.
      - ${SAVE_SYNC_FOLDER}:/syncdata/saves:ro
      - ${STATE_SYNC_FOLDER}:/syncdata/states:ro
      - ${PLATFORM_MAP_FILE}:/config/platform_mapping.yaml  # do not change the target bind mount or the filename!!
