<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>romm_syncthing_sync</title>
  <link rel="icon" href="icon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="ambient" id="ambient"></div>
  <div class="shell">
    <header class="topbar">
      <img class="brand-mark" src="icon.svg" alt="" />
      <span class="brand">romm_syncthing_sync</span>
      <div class="topbar-right">
        <span class="pill push-only" id="push-only-chip" hidden></span>
        <button class="pill" id="theme-toggle">Light</button>
        <div class="menu">
          <button class="pill menu-toggle" id="menu-toggle" aria-label="Maintenance" title="Maintenance" aria-expanded="false">
            <!-- Tabler Icons "tools" (MIT) -->
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 21h4l13 -13a1.5 1.5 0 0 0 -4 -4l-13 13v4" /><path d="M14.5 5.5l4 4" /><path d="M12 8l-5 -5l-4 4l5 5" />
              <path d="M7 8l-1.5 1.5" /><path d="M16 12l5 5l-4 4l-5 -5" /><path d="M16 17l-1.5 1.5" />
            </svg>
          </button>
          <div class="menu-panel" id="menu-panel" hidden></div>
        </div>
      </div>
    </header>

    <section id="hero"></section>
    <section id="needs-you"></section>

    <section class="split">
      <div class="panel" id="panel-local"></div>
      <div class="panel" id="panel-romm"></div>
    </section>

    <details class="applog" id="unmatched" hidden>
      <summary class="pill"></summary>
      <ul class="info-list" id="unmatched-body"></ul>
    </details>

    <details class="applog" id="applog">
      <summary class="pill">Application log</summary>
      <pre id="applog-body"></pre>
    </details>
  </div>

  <footer class="bottombar" id="bottombar"></footer>
  <div id="modal-root"></div>
  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
